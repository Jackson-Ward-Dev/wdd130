<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Exercise</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <h1> WDD 130 | HTML Form - User Poll</h1>
    <form>
        <fieldset>
                <legend>Contact Information</legend>
              <div class="form-item label-narrow">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>  
            <div class="form-item label-narrow">
                <label for="usermail">Email Address:</label>
                <input type="email" id="usermail" name="usermail" required>
                </div>
        </fieldset>
        <fieldset>
                <legend>Questions</legend>
            <div class="form-item label-wide">  
                <label for="quantity">Select your favorite web browser.</label>
                <select name="quantity" id="quantity">
                    <option value="select">Select</option>
                    <option value="chrome">Chrome</option>
                    <option value="brave">Brave</option>
                    <option value="safari">Safari</option>
                </select>
            </div>     
            <div class="form-item label-wide">   
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div> 
            <div class="form-item"> 
                <label for="places">List the places you have lived.</label>
                <textarea id="places" name="places" rows="10" placeholder="Mowapa, Motown, Stalingrad"></textarea>
            </div>
        </fieldset>
        <button type="submit">Submit Poll</button>



    </form>

</body>

</html>
